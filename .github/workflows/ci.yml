name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Full validation suite
        run: npm run test:all
        env:
          NODE_OPTIONS: --unhandled-rejections=strict
      - name: Install example projects from the locked Nexus tarball
        run: |
          npm --prefix c-ast ci --ignore-scripts
          npm --prefix dining-philosophers ci --ignore-scripts
      - name: Validate installed consumers and Vite production build
        run: |
          npm --prefix c-ast test
          npm run philosophers:build
      - name: Validate GitHub release package contents
        run: npm run check:release
